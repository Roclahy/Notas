name: Verify Notas internal link persistence (instrumented)

on:
  push:
    branches:
      - work/notas-120-link-test
    paths:
      - app/**
      - .github/workflows/test-notas-links.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  instrumented-links:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: SDK licenses
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"
      - name: Test saved link destinations on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash ./gradlew :app:connectedDebugAndroidTest --no-daemon --stacktrace
      - name: Upload test result reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notas-link-regression-test-results
          path: |
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
          if-no-files-found: ignore
