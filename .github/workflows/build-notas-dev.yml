name: Build Notas 1.4.17 (121) - signed release preparation

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - work/notas-143-ui-security-widget
      - work/notas-144-polish-lock-widget
      - work/notas-145-editor-backup
      - work/notas-146-header-metadata
      - work/notas-147-calendar-fix
      - work/notas-148-calendar-vector-fix
      - work/notas-149-calendar-raster-fix
      - work/notas-150-metadata-alignment
      - work/notas-151-stretch-overscroll
      - work/notas-152-independent-card-heights
      - work/notas-153-skip-empty-drafts
      - work/notas-154-grid-spacing
      - work/notas-155-creation-time-metadata
      - work/notas-157-critical-link-recovery
      - work/notas-158-safe-links-bulk-smart-color
    paths:
      - .github/workflows/build-notas-dev.yml
      - app/**

concurrency:
  group: notas-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-apks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android 36
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build installable debug APK
        run: bash ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload signed debug APK
        uses: actions/upload-artifact@v4
        with:
          name: notas-158-debug-installable
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Build optimized Release with R8
        run: bash ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Upload unsigned optimized Release APK
        uses: actions/upload-artifact@v4
        with:
          name: notas-158-r8-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

      - name: Bundle signing tools for offline secure signing
        run: |
          mkdir -p signing-tools
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" signing-tools/
          cp "$ANDROID_HOME/build-tools/36.0.0/zipalign" signing-tools/
          chmod +x signing-tools/zipalign

      - name: Upload signing tools
        uses: actions/upload-artifact@v4
        with:
          name: notas-release-signing-tools
          path: signing-tools/
          if-no-files-found: error

